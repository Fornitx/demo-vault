[versions]
kotlin-logging = "8.0.4"

spring-cloud = "2025.1.3"

scoped-mdc = "1.0.0-rc0"

[libraries]
kotlin-logging = { module = "io.github.oshai:kotlin-logging", version.ref = "kotlin-logging" }
# TODO migrade to org.slf4j:slf4j-scoped-mdc
scoped-mdc = { module = "ch.qos.logback:logback-scoped-mdc", version.ref = "scoped-mdc" }

spring-cloud-bom = {module="org.springframework.cloud:spring-cloud-dependencies", version.ref="spring-cloud"}

[plugins]
mockito = { id = "com.bakdata.mockito", version = "2.2.1" }