management:
  endpoints.web.exposure.include: '*'
  endpoint:
    configprops.show-values: always
    env.show-values: always
    health.show-details: always
    vault.enabled: true
  info:
    env.enabled: true
    java.enabled: true
    os.enabled: true
    process.enabled: true

spring:
  application.name: demo-vault
  jooq.sql-dialect: postgres
  datasource:
#    type: org.springframework.jdbc.datasource.SimpleDriverDataSource
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432,localhost:5433/pgdb
  #    username: pguser
#    password: pgpass

  #  r2dbc:
#    url: r2dbc:postgresql:failover://localhost:5432,localhost:5433/pgdb
#    pool:
#      enabled: false
#      validation-query: select 1
#      initial-size: 0
#      max-size: 5
#      max-idle-time: 1m
#      max-life-time: 10m
  quartz:
    auto-startup: true
    job-store-type: jdbc
    jdbc:
      initialize-schema: never
    overwrite-existing-jobs: true
    properties:
      org.quartz:
#        dataSource:
#          quartzDataSource:
#            driver: org.postgresql.Driver
#            URL: jdbc:postgresql://localhost:5432,localhost:5433/pgdb
#            maxConnections: 4
#            provider: hikaricp
        jobStore:
          class: org.springframework.scheduling.quartz.LocalDataSourceJobStore
#          class: org.quartz.impl.jdbcjobstore.JobStoreTX
          driverDelegateClass: org.quartz.impl.jdbcjobstore.PostgreSQLDelegate
          isClustered: true
        scheduler:
          instanceId: AUTO
          instanceName: Demo
        threadPool:
          threadCount: 1
  task.scheduling.pool.size: 5
  threads.virtual.enabled: true

logging:
  pattern.dateformat: HH:mm:ss.SSS
  level:
    com.example: debug

vault:
  enabled: true
  url: http://localhost:8200
  token: 00000000-0000-0000-0000-000000000000
  path: secret/data/myapp

#debug: true