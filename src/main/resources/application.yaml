management:
  endpoints:
    web:
      exposure:
        include: '*'
  endpoint:
    configprops:
      show-values: always
    env:
      show-values: always
    health:
      show-details: always
  info:
    env:
      enabled: true
    java:
      enabled: true
    os:
      enabled: true
    process:
      enabled: true

spring:
  application:
    name: demo-vault
  cloud:
    vault:
      uri: http://localhost:8200
      scheme: http
      fail-fast: true

      authentication: token
      token: 00000000-0000-0000-0000-000000000000
#      authentication: approle
#      app-role:
#        role-id: 4116bb89-7aa5-e4fa-5f5e-17bf45324bad
#        secret-id: d1e3e37f-9eef-9138-b11c-21a64542e920

      kv:
        enabled: true
        backend: secret

      config:
        lifecycle:
          enabled: true
          min-renewal: 10s
          expiry-threshold: 30s
  config:
    import:
      - vault://secret/myapp
  jooq:
    sql-dialect: postgres
#  datasource:
#    url: jdbc:postgresql://localhost:5432/pgdb
#    username: pguser
#    password: pgpass
  r2dbc:
    url: r2dbc:postgresql://localhost:5432/pgdb
#    pool:
#      validation-query: select 1
  #    username: pguser
#    password: pgpass
  threads:
    virtual:
      enabled: true

logging:
  pattern:
    dateformat: HH:mm:ss.SSS

