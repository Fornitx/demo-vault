management:
  endpoints.web.exposure.include: '*'
  endpoint:
    configprops.show-values: always
    env.show-values: always
    health.show-details: always
    vault.enabled: true
  info:
    env.enabled: true
    java.enabled: true
    os.enabled: true
    process.enabled: true

spring:
  application.name: demo-vault
  jooq.sql-dialect: postgres
#  datasource:
#    url: jdbc:postgresql://localhost:5432/pgdb
#    username: pguser
#    password: pgpass
  r2dbc:
    url: r2dbc:postgresql:failover://localhost:5432,localhost:5433/pgdb
    pool:
      enabled: false
      validation-query: select 1
      initial-size: 0
      max-size: 5
      max-idle-time: 1m
      max-life-time: 10m
  task.scheduling.pool.size: 5
  threads.virtual.enabled: true

logging:
  pattern.dateformat: HH:mm:ss.SSS
  level:
    com.example: debug

vault:
  enabled: true
  url: http://localhost:8200
  token: 00000000-0000-0000-0000-000000000000
  path: secret/data/myapp