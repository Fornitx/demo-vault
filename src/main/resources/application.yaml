  jooq:
    sql-dialect: postgres
#  datasource:
#    url: jdbc:postgresql://localhost:5432/pgdb
#    username: pguser
#    password: pgpass
  r2dbc:
    url: r2dbc:postgresql:failover://localhost:5432,localhost:5433/pgdb
    pool:
      validation-query: select 1
      initial-size: 2
      max-size: 10
      max-idle-time: 1m
      max-life-time: 10m
    username: pguser
    password: pgpass
  threads:
    virtual:
      enabled: true

logging:
  pattern:
    dateformat: HH:mm:ss.SSS

vault:
  enabled: true
  url: http://localhost:8200
  token: 00000000-0000-0000-0000-000000000000
  path: secret/data/myapp