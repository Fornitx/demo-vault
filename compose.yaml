services:

  vault:
    image: hashicorp/vault:2.1
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: "00000000-0000-0000-0000-000000000000"
      VAULT_ADDR: http://0.0.0.0:8200
    ports:
      - "8200:8200"

  postgres-1:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: pguser
      POSTGRES_PASSWORD: pgpass
      POSTGRES_DB: pgdb
    ports:
      - "5432-5433:5432"
    deploy:
      mode: replicated
      replicas: 2
